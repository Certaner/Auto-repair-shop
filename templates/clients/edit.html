{% extends "base.html" %}

{% block title %}Редактировать клиента {{ client.full_name }}{% endblock %}
{% block header %}Редактирование клиента: {{ client.full_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning">
                <h5 class="mb-0"><i class="bi bi-person-badge"></i> Редактирование информации</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_client', client_id=client.client_id) }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="last_name" class="form-label">Фамилия *</label>
                            <input type="text" class="form-control" id="last_name" name="last_name"
                                   value="{{ client.last_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="first_name" class="form-label">Имя *</label>
                            <input type="text" class="form-control" id="first_name" name="first_name"
                                   value="{{ client.first_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Телефон *</label>
                            <input type="tel" class="form-control" id="phone" name="phone"
                                   value="{{ client.phone }}" required>
                            <div class="form-text">Уникальный номер для идентификации</div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   value="{{ client.email or '' }}">
                        </div>
                        <div class="col-12 mt-4">
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{{ url_for('client_details', client_id=client.client_id) }}"
                                   class="btn btn-secondary me-md-2">
                                    <i class="bi bi-x-circle"></i> Отмена
                                </a>
                                <button type="submit" class="btn btn-warning">
                                    <i class="bi bi-check-lg"></i> Сохранить изменения
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
