{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}
{% block header %}Ошибка 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="error-template">
        <h1><i class="bi bi-exclamation-triangle text-warning"></i> 404</h1>
        <h2 class="mt-3">Страница не найдена</h2>
        <div class="error-details mt-3">
            Запрашиваемая страница не существует или была перемещена.
        </div>
        <div class="error-actions mt-4">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door"></i> На главную
            </a>
            <a href="{{ url_for('orders_list') }}" class="btn btn-outline-secondary btn-lg ms-2">
                <i class="bi bi-arrow-left"></i> Назад
            </a>
        </div>
    </div>
</div>
{% endblock %}
